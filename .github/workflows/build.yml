name: Build

# https://docs.github.com/en/actions/learn-github-actions/workflow-syntax-for-github-actions#concurrency
concurrency: 
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      # choose your default branch
      - master
      - main
    paths-ignore:
      - '*.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Checkout builds
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"
      
      - name: Clean old builds
        run: find "$GITHUB_WORKSPACE/builds" -maxdepth 1 -type f \( -name '*.cs3' -o -name 'plugins.json' \) -delete

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Build Plugins
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          # Los errores se sacan como anotaciones para poder leerlos sin
          # iniciar sesion en GitHub.
          ./gradlew make makePluginsJson 2>&1 | tee gradle-build.log || {
            grep -E "^e: |error:|FAILURE|What went wrong|^> " gradle-build.log | head -30 | while read -r line; do
              echo "::error::$line"
            done
            exit 1
          }
          find . -path '*/build/*.cs3' -exec cp {} $GITHUB_WORKSPACE/builds/ \;
          cp build/plugins.json $GITHUB_WORKSPACE/builds
          # El manifiesto del repositorio tambien se publica en la rama builds
          # para poder pegar esa URL en CloudStream -> Añadir repositorio.
          cp repo.json $GITHUB_WORKSPACE/builds

      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git commit --amend -m "Build $GITHUB_SHA" || exit 0   # do not error if nothing to commit
          git push --force
